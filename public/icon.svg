<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="180" fill="url(#glow)" />

  <!-- Badminton Racket / Blue Box Anime Symbol -->
  <g transform="translate(136, 120) scale(1)">
    <!-- Racket Rim -->
    <ellipse cx="120" cy="110" rx="75" ry="95" fill="none" stroke="#ffffff" stroke-width="14" />
    <!-- Strings -->
    <line x1="80" y1="110" x2="160" y2="110" stroke="#bae6fd" stroke-width="4" stroke-opacity="0.7" />
    <line x1="95" y1="75" x2="145" y2="75" stroke="#bae6fd" stroke-width="4" stroke-opacity="0.7" />
    <line x1="95" y1="145" x2="145" y2="145" stroke="#bae6fd" stroke-width="4" stroke-opacity="0.7" />
    <line x1="120" y1="35" x2="120" y2="185" stroke="#bae6fd" stroke-width="4" stroke-opacity="0.7" />
    <line x1="90" y1="45" x2="90" y2="175" stroke="#bae6fd" stroke-width="4" stroke-opacity="0.7" />
    <line x1="150" y1="45" x2="150" y2="175" stroke="#bae6fd" stroke-width="4" stroke-opacity="0.7" />
    <!-- Shaft & Handle -->
    <path d="M120 205 L120 285" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <rect x="110" y="270" width="20" height="50" rx="6" fill="#f43f5e" stroke="#ffffff" stroke-width="4" />
    <!-- Shuttlecock -->
    <circle cx="180" cy="90" r="14" fill="#ffffff" />
    <path d="M180 90 L220 70 L215 95 Z" fill="#bae6fd" opacity="0.9" />
    <path d="M180 90 L220 110 L215 95 Z" fill="#bae6fd" opacity="0.9" />
  </g>

  <!-- Sparkles -->
  <polygon points="380,110 388,126 404,134 388,142 380,158 372,142 356,134 372,126" fill="#fef08a" />
  <polygon points="120,380 125,392 137,397 125,402 120,414 115,402 103,397 115,392" fill="#fef08a" />
</svg>
